<!doctype html>
<!--
  Source for app/icon.png and app/apple-icon.png.

  The mark is sized in vh against a square card that fills the viewport, so the
  render is resolution-independent: screenshot the page, crop to the card's
  measured rect, downscale to 512 and 180.

  Kept flat: the ambient gradients used elsewhere turn to mud at 16px, which is
  the size that actually decides whether a favicon works. The coral dot is a
  real circle rather than the font's period, which would vanish at that size.
-->
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; }

      html, body { width: 100%; height: 100%; }

      body {
        background: #072520;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #card {
        height: 100vh;
        aspect-ratio: 1 / 1;
        background: #0e3b34;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mark {
        display: flex;
        align-items: flex-end;
        gap: 3.3vh;
        /* Bricolage sits its cap height high in the em box, so lift the pair
           to read as optically centred rather than metrically centred. */
        transform: translateY(-3.3vh);
      }

      .letter {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 70vh;
        line-height: 0.72;
        letter-spacing: -0.05em;
        color: #f6f3ed;
      }

      .dot {
        width: 12.9vh;
        height: 12.9vh;
        border-radius: 50%;
        background: #ff7a4d;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="mark">
        <div class="letter">P</div>
        <div class="dot"></div>
      </div>
    </div>
  </body>
</html>
