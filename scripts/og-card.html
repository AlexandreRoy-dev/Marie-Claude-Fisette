<!doctype html>
<!--
  Source for app/opengraph-image.png.

  Rendered once in a headless browser at 1200x630 and screenshotted, rather than
  generated per request with ImageResponse: the card is identical on every page,
  so it would be CPU spent redrawing a constant. Edit here, re-screenshot at
  1200x630, overwrite app/opengraph-image.png.

  Colours and type mirror app/globals.css. Nothing here may state a rate or
  imply an approval.
-->
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1200px; height: 630px; }

      body {
        position: relative;
        overflow: hidden;
        background: #0e3b34;
        color: #f6f3ed;
        font-family: "Instrument Sans", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 68px 76px;
      }

      /* The site's ambient wash, frozen. Edgeless on purpose: a hard-edged
         shape here would cut across the headline at thumbnail size. */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
      }
      .orb-citron {
        top: -220px;
        right: -170px;
        width: 720px;
        height: 720px;
        background: #d9f24b;
        opacity: 0.22;
      }
      .orb-coral {
        right: -120px;
        bottom: -250px;
        width: 500px;
        height: 500px;
        background: #ff7a4d;
        opacity: 0.18;
      }

      .row { position: relative; display: flex; align-items: center; }

      .wordmark {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -0.04em;
      }
      .wordmark span { color: #ff7a4d; }

      .rule {
        margin-left: 26px;
        width: 240px;
        height: 1px;
        background: rgba(246, 243, 237, 0.22);
      }

      .eyebrow {
        position: relative;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #d9f24b;
        margin-bottom: 24px;
      }

      h1 {
        position: relative;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 88px;
        line-height: 1.04;
        letter-spacing: -0.038em;
      }

      .sub {
        position: relative;
        margin-top: 28px;
        font-size: 26px;
        line-height: 1.45;
        color: rgba(246, 243, 237, 0.72);
        max-width: 640px;
      }

      .foot {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 21px;
        color: rgba(246, 243, 237, 0.6);
      }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: #d9f24b; }
    </style>
  </head>
  <body>
    <div class="orb orb-citron"></div>
    <div class="orb orb-coral"></div>

    <div class="row">
      <div class="wordmark">Palier<span>.</span></div>
      <div class="rule"></div>
    </div>

    <div>
      <div class="eyebrow">Marie-Claude Fisette</div>
      <h1>Courtière hypothécaire<br />résidentielle</h1>
      <p class="sub">
        J’analyse votre capacité d’emprunt et je compare les offres de
        plusieurs prêteurs.
      </p>
    </div>

    <div class="foot">
      <span>Sherbrooke et l’Estrie</span>
      <span class="dot"></span>
      <span>819 272-8422</span>
    </div>
  </body>
</html>
